[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mssb-editor"
version = "0.1.0"
description = "Browse, view and extract the assets in Mario Superstar Baseball's ZZZZ.dat"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
app = ["pywebview>=5"]
music = ["numpy", "miniaudio"]
dev = ["pytest>=8"]
build = ["pywebview>=5", "numpy", "miniaudio", "pyinstaller>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
zzzzdat = "zzzzdat.cli:main"

[tool.setuptools]
packages = ["zzzzdat", "zzzzdat.server", "zzzzdat.server.routes", "zzzzdat.music"]

[tool.setuptools.package-data]
zzzzdat = ["ui/*.html", "ui/vendor/*.js"]
