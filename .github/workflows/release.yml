name: Release

# Tag a commit `vX.Y` or `vX.Y.Z` (matching zzzzdat/version.py) and push the
# tag: this builds the Windows installer and the macOS disk image and
# publishes them as a GitHub Release. The editor's updater looks at the newest
# release. Bump zzzzdat/version.py and pyproject.toml *before* tagging -- the
# first job checks they agree with the tag and stops if they do not.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[build]"
      - name: Check the tag matches the version (v0.1 and 0.1.0 count as the same)
        run: python -c "import sys; from zzzzdat.version import VERSION, parse; t='${{ github.ref_name }}'; ok = parse(t) == parse(VERSION); print(t, 'vs', VERSION, 'ok' if ok else 'MISMATCH'); sys.exit(0 if ok else 1)"
      - run: python native/build_hvqm4.py
      - name: Install NSIS (no longer on the runner image)
        run: choco install nsis -y --no-progress
      - run: python build.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/MSSB Editor Setup *.exe

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[build]" pillow
      - run: python native/build_hvqm4.py
      - run: python tools/make_icon.py
      - run: python build.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/MSSB Editor *.dmg

  publish:
    name: Publish the release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Publish the installers on the release (created here, or made by hand on GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R assets
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" assets/windows-installer/* assets/macos-dmg/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" assets/windows-installer/* assets/macos-dmg/* --repo "${{ github.repository }}" --title "MSSB Editor ${{ github.ref_name }}" --generate-notes
          fi
