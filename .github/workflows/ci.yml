name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: Build the HVQM4 movie helper
        run: python native/build_hvqm4.py
      - name: Unit tests (game-backed tests skip without a game)
        run: pytest -q
        env:
          MSSB_TESTS_NO_GAME: "1"

  frontend:
    name: Frontend builds and matches the committed bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: The built UI in zzzzdat/ui/dist must be committed
        run: |
          git status --porcelain zzzzdat/ui/dist
          test -z "$(git status --porcelain zzzzdat/ui/dist)" || { echo "::error::zzzzdat/ui/dist is out of date: run 'npm run build' in frontend/ and commit the result"; exit 1; }

  build:
    name: Windows executable
    runs-on: windows-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[build]"
      - name: Build the HVQM4 movie helper
        run: python native/build_hvqm4.py
      - name: Install NSIS (no longer on the runner image)
        run: choco install nsis -y --no-progress
      - run: python build.py --installer
      - name: Smoke test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MSSB Editor\MSSB Editor.exe" -ArgumentList "serve","--port","8433","--no-browser" -PassThru
          Start-Sleep -Seconds 8
          try {
            $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8433/api/game
            if ($r.StatusCode -ne 200) { throw "status $($r.StatusCode)" }
            $ui = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8433/
            if ($ui.Content -notmatch "<div id=") { throw "UI did not render" }
          } finally { Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: MSSB-Editor-windows
          path: dist/MSSB Editor
      - uses: actions/upload-artifact@v4
        with:
          name: MSSB-Editor-installer
          path: dist/MSSB Editor Setup *.exe
